arch: yolov9
scale: e
nc: 80
reg_max: 16

# YOLOv9e — 58,206,592 parameters, 193.0 GFLOPs
# GELAN backbone with PGI (Programmable Gradient Information) via CBLinear/CBFuse.
# PGI is implemented as feature-enhancement within the backbone; it is NOT removed
# at inference. CBLinear/CBFuse layers remain active in both training and eval mode.

backbone:
  # [from, n, module, args]
  - [-1, 1, nn.Identity,   []]                        # 0  passthrough (anchor for layer 15)
  - [-1, 1, Conv,          [64, 3, 2]]                # 1-P1/2
  - [-1, 1, Conv,          [128, 3, 2]]               # 2-P2/4
  - [-1, 1, RepNCSPELAN4,  [256, 128, 64, 2]]         # 3
  - [-1, 1, ADown,         [256]]                     # 4-P3/8
  - [-1, 1, RepNCSPELAN4,  [512, 256, 128, 2]]        # 5
  - [-1, 1, ADown,         [512]]                     # 6-P4/16
  - [-1, 1, RepNCSPELAN4,  [1024, 512, 256, 2]]       # 7
  - [-1, 1, ADown,         [1024]]                    # 8-P5/32
  - [-1, 1, RepNCSPELAN4,  [1024, 512, 256, 2]]       # 9

  # PGI branches: project each scale's features to multiple channel sizes.
  # CBLinear returns a LIST of tensors (one per channel group).
  - [1, 1, CBLinear,       [[64]]]                    # 10 from P1 → list[64ch]
  - [3, 1, CBLinear,       [[64, 128]]]               # 11 from P2 → list[64ch, 128ch]
  - [5, 1, CBLinear,       [[64, 128, 256]]]          # 12 from P3 → list[64,128,256ch]
  - [7, 1, CBLinear,       [[64, 128, 256, 512]]]     # 13 from P4 → list[64,128,256,512ch]
  - [9, 1, CBLinear,       [[64, 128, 256, 512, 1024]]] # 14 from P5 → list[64,128,256,512,1024ch]

  # Auxiliary backbone: starts fresh from the input image (layer 0 = Identity).
  # CBFuse sums CBLinear[idx] from each scale + current feature, interpolating
  # each to the spatial size of the last input (the current layer output).
  - [0,  1, Conv,          [64, 3, 2]]                # 15-P1/2 (from raw input)
  - [[10, 11, 12, 13, 14, -1], 1, CBFuse, [[0, 0, 0, 0, 0]]]  # 16 (PGI-fused P1)
  - [-1, 1, Conv,          [128, 3, 2]]               # 17-P2/4
  - [[11, 12, 13, 14, -1], 1, CBFuse, [[1, 1, 1, 1]]]          # 18 (PGI-fused P2)
  - [-1, 1, RepNCSPELAN4,  [256, 128, 64, 2]]         # 19
  - [-1, 1, ADown,         [256]]                     # 20-P3/8
  - [[12, 13, 14, -1], 1, CBFuse, [[2, 2, 2]]]                 # 21 (PGI-fused P3)
  - [-1, 1, RepNCSPELAN4,  [512, 256, 128, 2]]        # 22
  - [-1, 1, ADown,         [512]]                     # 23-P4/16
  - [[13, 14, -1], 1, CBFuse, [[3, 3]]]                         # 24 (PGI-fused P4)
  - [-1, 1, RepNCSPELAN4,  [1024, 512, 256, 2]]       # 25
  - [-1, 1, ADown,         [1024]]                    # 26-P5/32
  - [[14, -1], 1, CBFuse, [[4]]]                                # 27 (PGI-fused P5)
  - [-1, 1, RepNCSPELAN4,  [1024, 512, 256, 2]]       # 28
  - [-1, 1, SPPELAN,       [512, 256]]                # 29

head:
  - [-1,       1, nn.Upsample,    [None, 2, "nearest"]]  # 30
  - [[-1, 25], 1, Concat,         [1]]                   # 31 cat backbone P4
  - [-1,       1, RepNCSPELAN4,   [512, 512, 256, 2]]    # 32

  - [-1,       1, nn.Upsample,    [None, 2, "nearest"]]  # 33
  - [[-1, 22], 1, Concat,         [1]]                   # 34 cat backbone P3
  - [-1,       1, RepNCSPELAN4,   [256, 256, 128, 2]]    # 35 P3/8-small

  - [-1,       1, ADown,          [256]]                 # 36
  - [[-1, 32], 1, Concat,         [1]]                   # 37 cat head P4
  - [-1,       1, RepNCSPELAN4,   [512, 512, 256, 2]]    # 38 P4/16-medium

  - [-1,       1, ADown,          [512]]                 # 39
  - [[-1, 29], 1, Concat,         [1]]                   # 40 cat head P5
  - [-1,       1, RepNCSPELAN4,   [512, 1024, 512, 2]]   # 41 P5/32-large

  - [[35, 38, 41], 1, Detect, [nc]]                      # Detect(P3, P4, P5)
