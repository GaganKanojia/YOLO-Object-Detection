arch: yolov9
scale: s
nc: 80
reg_max: 16

# YOLOv9s — 7,318,368 parameters, 27.6 GFLOPs
# GELAN backbone with ELAN1 blocks and AConv downsampling.

backbone:
  # [from, n, module, args]
  - [-1, 1, Conv,          [32, 3, 2]]             # 0-P1/2
  - [-1, 1, Conv,          [64, 3, 2]]             # 1-P2/4
  - [-1, 1, ELAN1,         [64, 64, 32]]            # 2
  - [-1, 1, AConv,         [128]]                   # 3-P3/8
  - [-1, 1, RepNCSPELAN4,  [128, 128, 64, 3]]       # 4
  - [-1, 1, AConv,         [192]]                   # 5-P4/16
  - [-1, 1, RepNCSPELAN4,  [192, 192, 96, 3]]       # 6
  - [-1, 1, AConv,         [256]]                   # 7-P5/32
  - [-1, 1, RepNCSPELAN4,  [256, 256, 128, 3]]      # 8
  - [-1, 1, SPPELAN,       [256, 128]]              # 9

head:
  - [-1,       1, nn.Upsample,    [None, 2, "nearest"]]  # 10
  - [[-1, 6],  1, Concat,         [1]]                   # 11 cat P4
  - [-1,       1, RepNCSPELAN4,   [192, 192, 96, 3]]     # 12

  - [-1,       1, nn.Upsample,    [None, 2, "nearest"]]  # 13
  - [[-1, 4],  1, Concat,         [1]]                   # 14 cat P3
  - [-1,       1, RepNCSPELAN4,   [128, 128, 64, 3]]     # 15 P3/8-small

  - [-1,       1, AConv,          [96]]                  # 16
  - [[-1, 12], 1, Concat,         [1]]                   # 17 cat head P4
  - [-1,       1, RepNCSPELAN4,   [192, 192, 96, 3]]     # 18 P4/16-medium

  - [-1,       1, AConv,          [128]]                 # 19
  - [[-1, 9],  1, Concat,         [1]]                   # 20 cat head P5
  - [-1,       1, RepNCSPELAN4,   [256, 256, 128, 3]]    # 21 P5/32-large

  - [[15, 18, 21], 1, Detect, [nc]]                      # Detect(P3, P4, P5)
