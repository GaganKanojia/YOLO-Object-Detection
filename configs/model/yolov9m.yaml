arch: yolov9
scale: m
nc: 80
reg_max: 16

# YOLOv9m — 20,216,160 parameters, 77.9 GFLOPs
# GELAN backbone with RepNCSPELAN4 blocks and AConv downsampling.

backbone:
  # [from, n, module, args]
  - [-1, 1, Conv,          [32, 3, 2]]              # 0-P1/2
  - [-1, 1, Conv,          [64, 3, 2]]              # 1-P2/4
  - [-1, 1, RepNCSPELAN4,  [128, 128, 64, 1]]       # 2
  - [-1, 1, AConv,         [240]]                   # 3-P3/8
  - [-1, 1, RepNCSPELAN4,  [240, 240, 120, 1]]      # 4
  - [-1, 1, AConv,         [360]]                   # 5-P4/16
  - [-1, 1, RepNCSPELAN4,  [360, 360, 180, 1]]      # 6
  - [-1, 1, AConv,         [480]]                   # 7-P5/32
  - [-1, 1, RepNCSPELAN4,  [480, 480, 240, 1]]      # 8
  - [-1, 1, SPPELAN,       [480, 240]]              # 9

head:
  - [-1,       1, nn.Upsample,    [None, 2, "nearest"]]  # 10
  - [[-1, 6],  1, Concat,         [1]]                   # 11 cat P4
  - [-1,       1, RepNCSPELAN4,   [360, 360, 180, 1]]    # 12

  - [-1,       1, nn.Upsample,    [None, 2, "nearest"]]  # 13
  - [[-1, 4],  1, Concat,         [1]]                   # 14 cat P3
  - [-1,       1, RepNCSPELAN4,   [240, 240, 120, 1]]    # 15 P3/8-small

  - [-1,       1, AConv,          [180]]                 # 16
  - [[-1, 12], 1, Concat,         [1]]                   # 17 cat head P4
  - [-1,       1, RepNCSPELAN4,   [360, 360, 180, 1]]    # 18 P4/16-medium

  - [-1,       1, AConv,          [240]]                 # 19
  - [[-1, 9],  1, Concat,         [1]]                   # 20 cat head P5
  - [-1,       1, RepNCSPELAN4,   [480, 480, 240, 1]]    # 21 P5/32-large

  - [[15, 18, 21], 1, Detect, [nc]]                      # Detect(P3, P4, P5)
