# Shared finetune config for the training-equivalence test (used by both pipelines).
# The Ultralytics script reads only the hyperparameter keys; the custom train.py also
# uses the model/data/save_dir/pretrained keys added per the plan (D7).

# ── Custom-pipeline plumbing (ignored by the Ultralytics reader) ──────
model              : configs/model/yolov11s.yaml
train_yaml         : dataset/subset3/data.yaml
val_yaml           : dataset/subset3/data.yaml
save_dir           : runs/finetune_custom_subset3
pretrained_weights : weights/yolov11s_official.pt
strategy           : partial

# ── Shared hyperparameters ────────────────────────────────────────────
nc             : 3
names          : ['person', 'car', 'dog']
epochs         : 30
batch          : 4
imgsz          : 640
workers        : 2
optimizer      : AdamW
lr0            : 0.001
lrf            : 0.1
momentum       : 0.937
weight_decay   : 0.0005
warmup_epochs  : 3.0
warmup_momentum: 0.8
warmup_bias_lr : 0.1
nbs            : 64
box            : 7.5
cls            : 0.5
dfl            : 1.5
mosaic         : 0.5
close_mosaic   : 5
mixup          : 0.0
cutmix         : 0.0
copy_paste     : 0.0
degrees        : 0.0
translate      : 0.1
scale          : 0.3
shear          : 0.0
perspective    : 0.0
flipud         : 0.0
fliplr         : 0.5
hsv_h          : 0.015
hsv_s          : 0.7
hsv_v          : 0.4
conf           : 0.5
iou            : 0.5
max_det        : 300
amp            : true
seed           : 42
patience       : 30
