# configs/training/smoke_test.yaml

# ── Dataset (same data for train and val — intentional smoke test) ──
train_img_dir  : dataset/coco128/images/train2017
train_ann_file : dataset/coco128/annotations.json
val_img_dir    : dataset/coco128/images/train2017
val_ann_file   : dataset/coco128/annotations.json
nc             : 80

# ── Model ───────────────────────────────────────────────────────────
model : configs/model/yolov11n.yaml    # nano — fastest for smoke test

# ── Training ────────────────────────────────────────────────────────
epochs        : 100
batch         : 4
imgsz         : 640
workers       : 2
save_dir      : runs/smoke_test

# ── Optimizer ───────────────────────────────────────────────────────
optimizer       : AdamW
lr0             : 0.001
lrf             : 0.01
momentum        : 0.937
weight_decay    : 0.0005
warmup_epochs   : 1.0
warmup_momentum : 0.8
warmup_bias_lr  : 0.1
nbs             : 16

# ── Loss weights ────────────────────────────────────────────────────
box : 7.5
cls : 0.5
dfl : 1.5

# ── Augmentation (light — we want fast overfitting) ─────────────────
mosaic       : 1.0
close_mosaic : 5
mixup        : 0.0
cutmix       : 0.0
copy_paste   : 0.0
degrees      : 0.0
translate    : 0.1
scale        : 0.3
shear        : 0.0
perspective  : 0.0
flipud       : 0.0
fliplr       : 0.5
hsv_h        : 0.015
hsv_s        : 0.7
hsv_v        : 0.4

# ── Validation ──────────────────────────────────────────────────────
conf    : 0.001
iou     : 0.7
max_det : 300

# ── Misc ────────────────────────────────────────────────────────────
patience : 50
amp      : true
device   : ''          # auto-detect CUDA, fallback CPU
