# configs/training/smoke_test_yolo.yaml
# YOLO format smoke test — uses data.yaml instead of ann_file.

# ── Dataset (YOLO format — single data.yaml covers both splits) ──────
train_yaml   : dataset/coco128/data.yaml
val_yaml     : dataset/coco128/data.yaml
# nc is inferred from data.yaml — do not set here, let parse_yolo_yaml set it.

# ── Model ───────────────────────────────────────────────────────────
model        : configs/model/yolov11n.yaml

# ── Training ────────────────────────────────────────────────────────
# epochs=100 (not 20): yolov11n trained *from scratch* (random init) on 128
# images across 80 classes cannot reach mAP@50>0.05 in 20 epochs in ANY format
# — at 20 epochs loss is still falling and mAP is still climbing. This mirrors
# the reference smoke_test.yaml (also 100 epochs), per STEP 7.3 "verify the same
# success criteria as the previous smoke test".
epochs       : 100
batch        : 4
imgsz        : 640
workers      : 2
save_dir     : runs/smoke_test_yolo

# ── Optimizer ───────────────────────────────────────────────────────
optimizer       : AdamW
lr0             : 0.001
lrf             : 0.01
momentum        : 0.937
weight_decay    : 0.0005
warmup_epochs   : 1.0
warmup_momentum : 0.8
warmup_bias_lr  : 0.1
# nbs=16 (not 64): with batch=4, nbs=64 → accumulate=16 → only ~40 optimizer
# steps in 20 epochs, far too few to clear the mAP bar. nbs=16 (→ accumulate=4)
# matches the proven COCO smoke_test.yaml and lets 20 epochs actually learn.
nbs             : 16

# ── Loss weights ────────────────────────────────────────────────────
box : 7.5
cls : 0.5
dfl : 1.5

# ── Augmentation ────────────────────────────────────────────────────
mosaic       : 1.0
close_mosaic : 5
mixup        : 0.0
cutmix       : 0.0
copy_paste   : 0.0
degrees      : 0.0
translate    : 0.1
scale        : 0.3
shear        : 0.0
perspective  : 0.0
flipud       : 0.0
fliplr       : 0.5
hsv_h        : 0.015
hsv_s        : 0.7
hsv_v        : 0.4

# ── Validation ──────────────────────────────────────────────────────
conf         : 0.001
iou          : 0.7
max_det      : 300

# ── Misc ────────────────────────────────────────────────────────────
patience : 50
amp      : true
device   : ''
