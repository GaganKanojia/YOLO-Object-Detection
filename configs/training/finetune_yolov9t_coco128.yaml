# Fine-tune YOLOv9t on COCO128 starting from Ultralytics pretrained weights.
# Same 80 classes → strategy=partial loads everything; only head biases are re-seeded.

train_yaml         : datasets/coco128/data.yaml
val_yaml           : datasets/coco128/data.yaml
model              : configs/model/yolov9t.yaml
pretrained_weights : yolov9t.pt
strategy           : partial

epochs        : 20
batch         : 8
imgsz         : 640
workers       : 2
save_dir      : runs/finetune_yolov9t

# Lower LR — we're fine-tuning, not training from scratch
optimizer       : AdamW
lr0             : 0.0001
lrf             : 0.01
momentum        : 0.937
weight_decay    : 0.0005
warmup_epochs   : 1.0
warmup_momentum : 0.8
warmup_bias_lr  : 0.01
nbs             : 16

box : 7.5
cls : 0.5
dfl : 1.5

# Disable mosaic for last 5 epochs to stabilise mAP before the run ends
mosaic       : 1.0
close_mosaic : 5
mixup        : 0.0
cutmix       : 0.0
copy_paste   : 0.0
degrees      : 0.0
translate    : 0.1
scale        : 0.5
shear        : 0.0
perspective  : 0.0
flipud       : 0.0
fliplr       : 0.5
hsv_h        : 0.015
hsv_s        : 0.7
hsv_v        : 0.4

conf    : 0.001
iou     : 0.7
max_det : 300

patience : 20
amp      : true
device   : ''
