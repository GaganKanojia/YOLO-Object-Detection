train_img_dir  : dataset/coco128/images/train2017
train_ann_file : dataset/coco128/annotations_train.json
# Smoke eval on the training annotations (same as the YOLO config, which evals on
# data.yaml val=train2017, and the project's own smoke_test.yaml). M7 verifies the
# validation pipeline yields non-zero metrics, not 80-class generalization from
# 102 images — and best.pt selection needs a fitness signal that rises with
# training, which a near-zero holdout mAP does not provide.
val_img_dir    : dataset/coco128/images/train2017
val_ann_file   : dataset/coco128/annotations_train.json
nc             : 80
model          : configs/model/yolov11n.yaml
# epochs=40, nbs=16 (plan template was 5/64): yolov11n from random init cannot
# produce non-zero mAP (M7 requirement) in 5 epochs — and nbs=64 with batch=4
# means accumulate=16, i.e. ~few optimizer steps. nbs=16 (accumulate=4) + 40
# epochs lets the model learn enough for the validation metric to be non-zero.
epochs         : 40
batch          : 4
imgsz          : 640
workers        : 2
save_dir       : runs/test_coco
optimizer      : AdamW
lr0            : 0.001
lrf            : 0.01
momentum       : 0.937
weight_decay   : 0.0005
warmup_epochs  : 1.0
warmup_momentum: 0.8
warmup_bias_lr : 0.1
nbs            : 16
box            : 7.5
cls            : 0.5
dfl            : 1.5
mosaic         : 1.0
close_mosaic   : 2
mixup          : 0.0
cutmix         : 0.0
copy_paste     : 0.0
degrees        : 0.0
translate      : 0.1
scale          : 0.3
shear          : 0.0
perspective    : 0.0
flipud         : 0.0
fliplr         : 0.5
hsv_h          : 0.015
hsv_s          : 0.7
hsv_v          : 0.4
conf           : 0.001
iou            : 0.7
max_det        : 300
patience       : 50
amp            : true
device         : ''
