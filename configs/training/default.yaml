# Training
epochs: 100
batch: 16
imgsz: 640
workers: 8
device: "0"
amp: true
patience: 100
save_period: -1
close_mosaic: 10

# Optimizer
optimizer: auto
lr0: 0.01
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
nbs: 64

# Warmup
warmup_epochs: 3.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1

# Loss weights
box: 7.5
cls: 0.5
dfl: 1.5

# Augmentation
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 0.0
translate: 0.1
scale: 0.5
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.5
mosaic: 1.0
mixup: 0.0
copy_paste: 0.0

# Validation / Inference
conf: 0.001
iou: 0.7
max_det: 300
agnostic_nms: false

# Paths (override at runtime)
data: ""
model: "configs/model/yolov11n.yaml"
project: "runs/train"
name: "exp"
